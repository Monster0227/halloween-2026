<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>南瓜灯里的信</title>
<style>
/* Layout: one night scene. Canvas sky sits behind a single centered column. A dark pumpkin lantern lights on tap,
   shrinks upward, and a letter types itself out below it, followed by a Trick-or-Treat ticket.
   Palette: night plum, pumpkin ember, candle amber, moon lilac, one rose for the love notes. */
:root{
  --night:#110a1e;
  --plum:#1d1230;
  --plum-2:#2a1a45;
  --ember:#ff8a1c;
  --candle:#ffd27a;
  --moon:#ece7ff;
  --mist:#b7a6d8;
  --rose:#ff86ad;
  --ink:#f4ecff;
  --font-display:"Kaiti SC","STKaiti","KaiTi","楷体","FZKai-Z03","DFKai-SB","Songti SC","Noto Serif CJK SC",serif;
  --font-body:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;
  --font-gothic:"Old English Text MT","UnifrakturCook","Georgia","Songti SC",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--font-body);overflow:hidden}
*{box-sizing:border-box}

/* ---------- scenery ---------- */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 70% at 50% 110%,#43204a 0%,rgba(67,32,74,0) 62%),
    linear-gradient(#0c0618,#150b27 55%,#22113a)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.moon{position:fixed;z-index:1;pointer-events:none;width:74px;height:74px;border-radius:50%;
  top:calc(30px + env(safe-area-inset-top,0px));left:max(22px,env(safe-area-inset-left,0px));
  background:radial-gradient(circle at 35% 30%,#fffdf6,#e5ddff 55%,#b8abe2);
  box-shadow:0 0 36px 8px rgba(190,170,255,.28),0 0 130px 34px rgba(150,120,255,.14);opacity:.94}
.moon::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 62% 36%,rgba(120,105,170,.30) 0 7px,transparent 8px),
    radial-gradient(circle at 36% 66%,rgba(120,105,170,.24) 0 10px,transparent 11px),
    radial-gradient(circle at 72% 72%,rgba(120,105,170,.22) 0 5px,transparent 6px)}
.fog{position:fixed;z-index:1;pointer-events:none;left:-20%;right:-20%;bottom:0;height:42vh;
  background:
    radial-gradient(50% 60% at 30% 72%,rgba(190,170,255,.11),transparent 70%),
    radial-gradient(45% 55% at 76% 62%,rgba(255,150,90,.08),transparent 70%);
  animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-5%)}to{transform:translateX(5%)}}
#ground{position:fixed;z-index:1;pointer-events:none;left:0;right:0;bottom:0;width:100%;height:max(15vh,110px)}
#tree{position:fixed;z-index:1;pointer-events:none;left:-14px;bottom:0;height:min(36vh,270px);width:auto}

/* ---------- scroll area ---------- */
#scroll{position:relative;z-index:2;height:100%;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.col{max-width:600px;margin:0 auto;min-height:100%;
  padding-block:clamp(36px,12vh,110px) 140px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;text-align:center;
  transition:padding-top .9s cubic-bezier(.2,.7,.2,1)}
.col.lit{padding-top:clamp(18px,4vh,40px)}

.intro,.hint{overflow:hidden;transition:max-height .9s cubic-bezier(.2,.7,.2,1),opacity .6s,margin .9s}
.intro{max-height:260px;margin:0 0 6px}
.col.lit .intro,.col.lit .hint{max-height:0;opacity:0;margin-top:0;margin-bottom:0}
.eyebrow{margin:0 0 16px;font-size:12px;letter-spacing:.42em;color:var(--mist);display:flex;align-items:center;justify-content:center;gap:12px}
.eyebrow i{width:5px;height:5px;background:var(--ember);transform:rotate(45deg);display:block}
h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(32px,9.4vw,46px);line-height:1.36;color:var(--ink);text-wrap:balance}
h1 em{font-style:normal;color:var(--candle);text-shadow:0 0 22px rgba(255,160,60,.45)}

/* ---------- lantern ---------- */
.lantern{all:unset;display:block;position:relative;width:min(72vw,300px);aspect-ratio:300/280;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:width 1s cubic-bezier(.2,.7,.2,1),margin .9s;margin-top:4px}
.lantern:focus-visible{outline:2px solid var(--candle);outline-offset:8px;border-radius:14px}
.col.lit .lantern{width:min(38vw,164px);cursor:default}
.lantern svg{position:relative;z-index:1;display:block;width:100%;height:100%;overflow:visible;animation:bob 5.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.glow{position:absolute;inset:-38%;border-radius:50%;pointer-events:none;opacity:0;transition:opacity 1.2s ease;
  background:radial-gradient(closest-side,rgba(255,150,40,.58),rgba(255,110,20,.20) 52%,transparent 76%)}
.lantern.on .glow{opacity:1;animation:flick 3s infinite}
.ring{position:absolute;inset:6% 4%;border-radius:50%;border:1px solid rgba(255,170,80,.45);pointer-events:none;animation:ping 2.6s ease-out infinite}
.lantern.on .ring{display:none}
@keyframes ping{0%{transform:scale(.86);opacity:.8}100%{transform:scale(1.22);opacity:0}}
@keyframes flick{0%,100%{opacity:1;transform:scale(1)}18%{opacity:.84;transform:scale(.985)}32%{opacity:1}51%{opacity:.9;transform:scale(1.025)}70%{opacity:.78;transform:scale(.99)}84%{opacity:1}}
.pk-on{opacity:0;transition:opacity 1.1s ease .12s}
.lantern.on .pk-on{opacity:1}
.lantern.on .face-glow{animation:flick 2.6s infinite}
.hint{margin:14px 0 0;max-height:40px;font-size:13px;letter-spacing:.38em;color:var(--mist);display:flex;align-items:center;justify-content:center;gap:10px}
.hint .dot{width:6px;height:6px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px var(--ember);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- letter ---------- */
.letter{width:100%;margin-top:22px;padding:28px 24px 24px;text-align:left;border-radius:6px;
  background:linear-gradient(180deg,rgba(42,26,69,.80),rgba(29,18,48,.84));
  border:1px solid rgba(183,166,216,.24);
  box-shadow:0 24px 60px -24px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,210,122,.20);
  opacity:0;transform:translateY(16px);transition:opacity .9s ease,transform .9s ease;cursor:pointer}
.letter.show{opacity:1;transform:none}
.to{margin:0 0 14px;font-family:var(--font-display);font-size:30px;line-height:1.3;color:var(--candle);min-height:1.3em}
#body p{margin:0 0 12px;font-size:17px;line-height:2;color:#f1e8ff;text-wrap:pretty}
.caret{display:inline-block;width:2px;height:1.1em;margin-left:2px;vertical-align:-.16em;background:var(--candle);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sign{margin:14px 0 0;text-align:right;opacity:0;transition:opacity 1s ease}
.sign.show{opacity:1}
.sign .who{display:block;font-family:var(--font-display);font-size:28px;color:var(--rose)}
.sign .when{display:block;margin-top:2px;font-size:12px;letter-spacing:.28em;color:var(--mist)}
.skip{margin:10px 0 0;font-size:12px;letter-spacing:.24em;color:var(--mist);text-align:center;opacity:.8}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- trick or treat ---------- */
.choose{width:100%;margin-top:44px;display:flex;flex-direction:column;align-items:center;animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.choose h2{margin:0;font-family:var(--font-gothic);font-weight:400;font-size:clamp(40px,12vw,54px);line-height:1.1;color:var(--candle);text-shadow:0 0 26px rgba(255,150,50,.5)}
.choose .sub{margin:8px 0 22px;font-size:14px;letter-spacing:.2em;color:var(--mist)}
.btns{display:flex;gap:12px;width:100%;justify-content:center;flex-wrap:wrap}
.btn{appearance:none;font:inherit;cursor:pointer;flex:1 1 140px;max-width:210px;min-height:60px;padding:10px 20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:4px;
  -webkit-tap-highlight-color:transparent;transition:transform .2s ease,box-shadow .3s ease,background .3s ease}
.btn b{font-family:var(--font-gothic);font-weight:400;font-size:26px;letter-spacing:.05em;line-height:1}
.btn span{font-size:13px;letter-spacing:.34em;margin-right:-.34em}
.btn.ghost{background:rgba(183,166,216,.08);color:var(--moon);border:1px solid rgba(183,166,216,.5)}
.btn.solid{background:linear-gradient(135deg,#ffb347,#ff7a1a);color:#2b1205;border:1px solid #ffb347;box-shadow:0 10px 30px -10px rgba(255,130,30,.7)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:focus-visible,.snd:focus-visible,.link:focus-visible{outline:2px solid var(--candle);outline-offset:3px}

.ticket{--c1:#ffb347;--c2:#ff7a1a;--tk-ink:#2b1205;width:100%;max-width:440px;margin:28px auto 0;display:grid;grid-template-columns:minmax(0,1fr) 76px;text-align:left;
  color:var(--tk-ink);background:linear-gradient(135deg,var(--c1),var(--c2));
  -webkit-mask:radial-gradient(circle 9px at calc(100% - 76px) 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at calc(100% - 76px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 9px at calc(100% - 76px) 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at calc(100% - 76px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.ticket[data-kind="trick"]{--c1:#c7adff;--c2:#ff86ad;--tk-ink:#241040}
.ticket.pop{animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.88) rotate(-2.5deg)}to{opacity:1;transform:none}}
.t-main{padding:22px 18px 22px 22px;min-width:0}
.t-kind{margin:0;font-family:var(--font-gothic);font-size:17px;letter-spacing:.14em}
.t-title{margin:6px 0 10px;font-family:var(--font-display);font-size:clamp(26px,7.4vw,32px);line-height:1.25}
.t-note{margin:0;font-size:14px;line-height:1.75}
.t-stub{border-left:2px dashed rgba(43,18,5,.38);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:var(--font-gothic);font-size:15px;letter-spacing:.22em}
.end{margin:22px 0 0;font-family:var(--font-display);font-size:24px;color:var(--rose)}
.link{all:unset;cursor:pointer;margin-top:22px;padding:8px 6px;font-size:13px;letter-spacing:.26em;color:var(--mist);border-bottom:1px solid rgba(183,166,216,.4)}

/* ---------- sound ---------- */
.snd{all:unset;position:fixed;z-index:5;cursor:pointer;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;
  top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));
  color:var(--mist);background:rgba(17,10,30,.6);border:1px solid rgba(183,166,216,.32);-webkit-tap-highlight-color:transparent}
.snd svg{width:20px;height:20px}
.snd .slash{display:none}
.snd.muted .slash{display:block}
.snd.muted .waves{display:none}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .pk-on{opacity:1}
}
</style>
</head>
<body>


<div id="sky"></div>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="moon" aria-hidden="true"></div>
<div class="fog" aria-hidden="true"></div>

<svg id="ground" viewBox="0 0 800 120" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 78 C120 38 250 72 390 50 S650 28 800 62 L800 120 L0 120Z" fill="#08040f"/>
  <path d="M0 100 C160 76 300 104 470 88 S700 78 800 94 L800 120 L0 120Z" fill="#0b0615"/>
</svg>
<svg id="tree" viewBox="0 0 200 270" aria-hidden="true" fill="none" stroke="#08040f" stroke-linecap="round">
  <path d="M72 270 C76 218 66 176 78 128 C84 98 80 74 90 40" stroke-width="13"/>
  <path d="M78 140 C52 128 32 108 14 74" stroke-width="6"/>
  <path d="M80 122 C108 110 132 98 162 70" stroke-width="6"/>
  <path d="M88 72 C72 58 58 46 40 30" stroke-width="4"/>
  <path d="M88 62 C106 50 122 40 144 24" stroke-width="4"/>
  <path d="M30 96 C24 86 22 78 24 66" stroke-width="3"/>
  <path d="M130 90 C140 84 148 82 156 84" stroke-width="3"/>
  <path d="M52 46 C48 38 48 30 52 22" stroke-width="2.5"/>
  <path d="M122 40 C126 32 132 28 140 28" stroke-width="2.5"/>
</svg>

<main id="scroll">
  <div class="col" id="col">
    <header class="intro">
      <p class="eyebrow"><span>2026.10.31</span><i></i><span>万圣夜</span></p>
      <h1>今晚有一份礼物<br><em>藏在南瓜灯里</em></h1>
    </header>

    <button class="lantern" id="lantern" type="button" aria-label="点亮南瓜灯，打开一封信">
      <span class="glow"></span>
      <span class="ring"></span>
      <svg viewBox="0 0 300 280" aria-hidden="true">
        <defs>
          <radialGradient id="pk-off" cx="50%" cy="42%" r="66%">
            <stop offset="0" stop-color="#7a4220"/><stop offset=".55" stop-color="#4a2512"/><stop offset="1" stop-color="#24120a"/>
          </radialGradient>
          <radialGradient id="pk-on" cx="50%" cy="42%" r="68%">
            <stop offset="0" stop-color="#ffb347"/><stop offset=".48" stop-color="#ff8a1c"/><stop offset="1" stop-color="#c24a06"/>
          </radialGradient>
          <radialGradient id="inner" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ffe3a0" stop-opacity=".6"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
          </radialGradient>
          <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
          <path id="heart" d="M0 11 C-24 -6 -15 -28 0 -15 C15 -28 24 -6 0 11Z"/>
          <g id="lobes">
            <ellipse cx="70" cy="166" rx="64" ry="98"/>
            <ellipse cx="230" cy="166" rx="64" ry="98"/>
            <ellipse cx="116" cy="166" rx="62" ry="102"/>
            <ellipse cx="184" cy="166" rx="62" ry="102"/>
            <ellipse cx="150" cy="166" rx="58" ry="104"/>
          </g>
          <g id="face">
            <use href="#heart" transform="translate(110 148)"/>
            <use href="#heart" transform="translate(190 148)"/>
            <path d="M150 168 L141 185 Q150 190 159 185Z"/>
            <path d="M98 200 Q150 228 202 200 Q192 250 150 252 Q108 250 98 200Z"/>
          </g>
          <g id="stem">
            <path d="M140 74 C138 52 148 36 168 26 C172 40 168 56 162 76Z"/>
          </g>
        </defs>

        <!-- unlit -->
        <g class="pk-off">
          <use href="#lobes" fill="url(#pk-off)" stroke="#1a0b06" stroke-opacity=".7" stroke-width="2"/>
          <use href="#stem" fill="#2c3414"/>
          <use href="#face" fill="#140a10"/>
        </g>

        <!-- lit -->
        <g class="pk-on">
          <use href="#lobes" fill="url(#pk-on)" stroke="#9a3a05" stroke-opacity=".55" stroke-width="2"/>
          <ellipse cx="150" cy="178" rx="104" ry="78" fill="url(#inner)"/>
          <use href="#stem" fill="#4f6a22"/>
          <path d="M168 40 C190 30 204 42 197 58 C192 50 184 48 178 52" fill="none" stroke="#7fa23c" stroke-width="4" stroke-linecap="round"/>
          <ellipse cx="72" cy="190" rx="16" ry="9" fill="#ff86ad" opacity=".38"/>
          <ellipse cx="228" cy="190" rx="16" ry="9" fill="#ff86ad" opacity=".38"/>
          <g class="face-glow">
            <use href="#face" fill="#ffb13d" filter="url(#blur)" opacity=".95"/>
            <use href="#face" fill="#fff1c9"/>
          </g>
        </g>
      </svg>
    </button>
    <p class="hint" id="hint"><span class="dot"></span>轻点南瓜灯</p>

    <article class="letter" id="letter" hidden>
      <div class="sr" id="sr"></div>
      <div aria-hidden="true">
        <p class="to" id="to"></p>
        <div id="body"></div>
        <div class="sign" id="sign"></div>
      </div>
      <p class="skip" id="skip">轻点信纸，直接看完</p>
    </article>

    <section class="choose" id="choose" hidden>
      <h2>Trick or Treat?</h2>
      <p class="sub">不给糖就捣蛋，选一个吧</p>
      <div class="btns">
        <button class="btn ghost" id="btnTrick" type="button"><b>Trick</b><span>捣蛋</span></button>
        <button class="btn solid" id="btnTreat" type="button"><b>Treat</b><span>给糖</span></button>
      </div>
      <div class="ticket" id="ticket" data-kind="treat" hidden>
        <div class="t-main">
          <p class="t-kind" id="tKind"></p>
          <p class="t-title" id="tTitle"></p>
          <p class="t-note" id="tNote"></p>
        </div>
        <div class="t-stub">HALLOWEEN 2026</div>
      </div>
      <p class="end" id="end" hidden>选哪个，都是糖。</p>
      <button class="link" id="replay" type="button" hidden>再点亮一次</button>
    </section>
  </div>
</main>

<button class="snd" id="snd" type="button" aria-pressed="true" aria-label="声音开关" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/>
    <path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.6 6a8.6 8.6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
</button>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(() => {
'use strict';

/* ===== 想改的内容都在这里 ===== */
const CONFIG = {
  to: '亲爱的景恩：',
  lines: [
    '今天是万圣节，街上到处都是面具和怪物。',
    '我想了想，今年不扮鬼，也不扮吸血鬼，就以我自己的样子来见你。',
    '听说万圣节是一年里最接近另一个世界的夜晚，那些平时藏起来的东西，都会趁今晚出来透透气。那我也想趁今晚坦白一件事：我藏了很多很多喜欢，平时说不完，今天想一次都倒给你。',
    '因为在所有会吓人的东西里，最让我心跳漏一拍的，是你突然朝我笑的那一下。',
    '和你在一起以后，我发现很多普通的日子都变得不太一样。吃饭、走路、发呆，只要旁边是你，连等红灯都不觉得无聊。',
    '我知道自己不是什么完美的人，有时候嘴笨，有时候犯傻，但我是认真的。认真喜欢你，认真想把你的每一天，都变得好一点点。',
    '愿今晚的南瓜灯替我守着你，愿你走过的每个路口都有糖，愿所有的鬼都绕着你走。',
    '愿你累的时候有人可以靠，开心的时候有人陪你一起傻笑，不开心的时候，我就在旁边，不用说话也行。',
    '以后的每一个万圣节，我都想和你一起过。你负责挑糖，我负责拎糖袋，顺便帮你挡鬼。',
    '至于今晚，我只负责一件事：站在你身边。',
    '万圣节快乐，景恩。'
  ],
  from: '思灏',
  date: '2026.10.31 夜',
  treat: { title: '奶茶一杯，拥抱一个', note: '持券人：张景恩' },
  trick: { title: '恶作剧成功', note: '你已经被我悄悄喜欢很久了，这件事无法撤销。' }
};

const $ = id => document.getElementById(id);
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);
const col = $('col'), scroller = $('scroll'), lantern = $('lantern'), letter = $('letter');
const toEl = $('to'), bodyEl = $('body'), signEl = $('sign'), skipEl = $('skip');
const choose = $('choose'), ticket = $('ticket'), endEl = $('end'), replayBtn = $('replay'), sndBtn = $('snd');

$('sr').textContent = CONFIG.to + CONFIG.lines.join('') + CONFIG.from + ' ' + CONFIG.date;

/* ===== canvas: stars + fx ===== */
const starCv = $('stars'), fxCv = $('fx');
const sctx = starCv.getContext('2d'), fctx = fxCv.getContext('2d');
let W = 0, H = 0;
const stars = Array.from({ length: 110 }, () => ({ x: Math.random(), y: Math.random() * .75, r: rand(.4, 1.5), p: rand(0, 6.28), s: rand(.5, 1.6) }));

function drawStars(t) {
  sctx.clearRect(0, 0, W, H);
  sctx.fillStyle = '#efe9ff';
  for (const s of stars) {
    const a = reduce ? .6 : .3 + .7 * (.5 + .5 * Math.sin(t * s.s + s.p));
    sctx.globalAlpha = a * .9;
    sctx.beginPath();
    sctx.arc(s.x * W, s.y * H, s.r, 0, 6.283);
    sctx.fill();
  }
  sctx.globalAlpha = 1;
}
function fit() {
  const d = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  for (const [c, x] of [[starCv, sctx], [fxCv, fctx]]) {
    c.width = Math.round(W * d); c.height = Math.round(H * d);
    x.setTransform(d, 0, 0, d, 0, 0);
  }
  drawStars(0);
}
window.addEventListener('resize', fit);
fit();

const bats = [], embers = [], bits = [];
let emberOn = false, emberAcc = 0, ambientAt = 3;

function lanternBox() {
  const r = lantern.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height, left: r.left, top: r.top };
}
function spawnBurst() {
  const c = lanternBox();
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI * (.1 + .8 * (i / 8)) + rand(-.15, .15);
    const sp = rand(220, 380);
    bats.push({ x: c.x + rand(-20, 20), y: c.y - c.h * .1, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, s: .25, smax: rand(.8, 1.3),
      fs: rand(13, 19), ph: rand(0, 6.28), cruise: rand(90, 150), age: 0, bob: rand(10, 26), bf: rand(2, 4) });
  }
}
function spawnAmbient() {
  if (bats.length > 14) return;
  const left = Math.random() < .5;
  const vx = (left ? 1 : -1) * rand(70, 120);
  const s = rand(.7, 1.1);
  bats.push({ x: left ? -50 : W + 50, y: rand(.08, .45) * H, vx, vy: rand(-10, 10), s, smax: s,
    fs: rand(11, 16), ph: rand(0, 6.28), cruise: Math.abs(vx), age: 0, bob: rand(14, 30), bf: rand(1.5, 3) });
}
function emitEmber() {
  const c = lanternBox();
  embers.push({ x: c.left + c.w * rand(.25, .75), y: c.top + c.h * rand(.1, .45), vx: rand(-14, 14), vy: rand(-70, -28), r: rand(.8, 2.4), life: 0, max: rand(1.8, 3.6), ph: rand(0, 6.28) });
}
function confetti(x, y) {
  const cols = ['#ff8a1c', '#ffd27a', '#ff86ad', '#b79cff'];
  for (let i = 0; i < 28; i++) {
    bits.push({ x, y, vx: rand(-190, 190), vy: rand(-440, -180), rot: rand(0, 6.28), vr: rand(-6, 6), s: rand(5, 9), c: cols[i % 4], heart: i % 3 !== 0, life: 0, max: rand(1.6, 2.4) });
  }
}
function stepBat(b, dt) {
  b.age += dt;
  b.s = Math.min(b.smax, b.s + dt * 1.4);
  const sp = Math.hypot(b.vx, b.vy);
  if (sp > b.cruise) { const k = Math.max(b.cruise / sp, 1 - dt * 1.6); b.vx *= k; b.vy *= k; }
  b.x += b.vx * dt;
  b.y += b.vy * dt + Math.sin(b.age * b.bf) * b.bob * dt;
}
function drawBat(b, t) {
  const flap = Math.sin(t * b.fs + b.ph);
  fctx.save();
  fctx.translate(b.x, b.y);
  fctx.rotate(Math.max(-.4, Math.min(.4, b.vx * .0016)));
  fctx.scale(b.s, b.s);
  fctx.fillStyle = '#05020a';
  fctx.strokeStyle = 'rgba(183,166,216,.28)';
  fctx.lineWidth = .8;
  fctx.beginPath(); fctx.ellipse(0, 0, 4, 7, 0, 0, 6.283); fctx.fill();
  fctx.beginPath();
  fctx.moveTo(-3, -5); fctx.lineTo(-3.6, -11.5); fctx.lineTo(0, -7.5); fctx.lineTo(3.6, -11.5); fctx.lineTo(3, -5);
  fctx.closePath(); fctx.fill();
  for (const sg of [1, -1]) {
    fctx.save(); fctx.scale(sg, 1);
    const l = flap * 16;
    fctx.beginPath();
    fctx.moveTo(2, -3);
    fctx.quadraticCurveTo(14, -14 + l * .6, 31, -8 + l);
    fctx.quadraticCurveTo(26, -2 + l * .7, 22, 2 + l * .5);
    fctx.quadraticCurveTo(19, -1 + l * .4, 15, 5 + l * .3);
    fctx.quadraticCurveTo(11, 2 + l * .2, 6, 8);
    fctx.quadraticCurveTo(3, 4, 2, 3);
    fctx.closePath(); fctx.fill(); fctx.stroke();
    fctx.restore();
  }
  fctx.restore();
}
function heartPath(s) {
  fctx.beginPath();
  fctx.moveTo(0, s * .35);
  fctx.bezierCurveTo(-s * 1.1, -s * .35, -s * .5, -s * 1, 0, -s * .4);
  fctx.bezierCurveTo(s * .5, -s * 1, s * 1.1, -s * .35, 0, s * .35);
  fctx.fill();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  drawStars(t);
  fctx.clearRect(0, 0, W, H);

  ambientAt -= dt;
  if (ambientAt <= 0) { spawnAmbient(); ambientAt = rand(7, 12); }
  if (emberOn) { emberAcc += dt * 11; while (emberAcc >= 1) { emitEmber(); emberAcc -= 1; } }

  for (let i = bats.length - 1; i >= 0; i--) {
    const b = bats[i]; stepBat(b, dt); drawBat(b, t);
    if (b.x < -90 || b.x > W + 90 || b.y < -90 || b.y > H + 90 || b.age > 18) bats.splice(i, 1);
  }

  fctx.globalCompositeOperation = 'lighter';
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i]; e.life += dt;
    if (e.life > e.max) { embers.splice(i, 1); continue; }
    e.x += (e.vx + Math.sin(t * 2 + e.ph) * 12) * dt; e.y += e.vy * dt;
    const a = (1 - e.life / e.max) * (.65 + .35 * Math.sin(t * 9 + e.ph));
    fctx.fillStyle = 'rgba(255,150,50,' + (a * .18) + ')';
    fctx.beginPath(); fctx.arc(e.x, e.y, e.r * 3.2, 0, 6.283); fctx.fill();
    fctx.fillStyle = 'rgba(255,214,130,' + a + ')';
    fctx.beginPath(); fctx.arc(e.x, e.y, e.r, 0, 6.283); fctx.fill();
  }
  fctx.globalCompositeOperation = 'source-over';

  for (let i = bits.length - 1; i >= 0; i--) {
    const p = bits[i]; p.life += dt;
    if (p.life > p.max) { bits.splice(i, 1); continue; }
    p.vy += 520 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.rot);
    fctx.globalAlpha = Math.min(1, (p.max - p.life) * 2);
    fctx.fillStyle = p.c;
    if (p.heart) heartPath(p.s); else { fctx.beginPath(); fctx.arc(0, 0, p.s * .45, 0, 6.283); fctx.fill(); }
    fctx.restore();
  }
  requestAnimationFrame(frame);
}
if (!reduce) requestAnimationFrame(frame);

/* ===== sound: a tiny music box ===== */
let ac = null, master = null, soundOn = true, step = 0, timer = null;
const MEL = [57, 60, 64, 60, 59, 62, 65, 62, 57, 60, 64, 69, 68, 64, 60, 64];
function note(m, when, dur, vol) {
  if (!ac || !master) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle';
  o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + .05);
}
function tick() {
  if (!ac || !soundOn) return;
  const n = MEL[step % MEL.length];
  note(n + 12, 0, 1.7, .11);
  if (step % 4 === 0) note(n - 12, 0, 2.2, .09);
  step++;
}
function startMusic() {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    if (!master) { master = ac.createGain(); master.connect(ac.destination); }
    master.gain.value = soundOn ? .55 : 0;
    [81, 84, 88, 93].forEach((m, i) => note(m, i * .09, 1.2, .1));
    clearInterval(timer);
    timer = setInterval(tick, 540);
  } catch (e) { /* audio is optional */ }
}
function stopMusic() { clearInterval(timer); timer = null; }
sndBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  sndBtn.classList.toggle('muted', !soundOn);
  sndBtn.setAttribute('aria-pressed', String(soundOn));
  if (master && ac) master.gain.setTargetAtTime(soundOn ? .55 : 0, ac.currentTime, .05);
});
document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden) ac.suspend(); else if (soundOn) ac.resume();
});

/* ===== the letter ===== */
let lit = false, runId = 0, fast = reduce, followCount = 0;
const caret = document.createElement('span');
caret.className = 'caret';
const wait = ms => new Promise(r => setTimeout(r, fast ? 0 : ms));
const delayFor = ch => '，、；'.includes(ch) ? 230 : '。！？…'.includes(ch) ? 440 : 56 + Math.random() * 34;

function follow() {
  if (++followCount % 8) return;
  const r = caret.getBoundingClientRect();
  const limit = window.innerHeight - 120;
  if (r.bottom > limit) scroller.scrollBy({ top: r.bottom - limit + 24 });
}
async function typeText(node, text, my) {
  for (let i = 0; i < text.length; i++) {
    if (my !== runId) return false;
    if (fast) { node.nodeValue = text; return true; }
    node.nodeValue += text[i];
    follow();
    await wait(delayFor(text[i]));
  }
  return my === runId;
}
async function typeLetter() {
  const my = ++runId;
  fast = reduce;
  toEl.textContent = ''; bodyEl.textContent = '';
  signEl.classList.remove('show'); signEl.textContent = '';
  skipEl.hidden = false;

  const tn = document.createTextNode('');
  toEl.appendChild(tn); toEl.appendChild(caret);
  if (!(await typeText(tn, CONFIG.to, my))) return;
  await wait(300);

  for (const line of CONFIG.lines) {
    if (my !== runId) return;
    const p = document.createElement('p');
    const n = document.createTextNode('');
    p.appendChild(n); p.appendChild(caret);
    bodyEl.appendChild(p);
    if (!(await typeText(n, line, my))) return;
    await wait(420);
  }
  if (my !== runId) return;
  caret.remove();
  skipEl.hidden = true;

  const who = document.createElement('span'); who.className = 'who'; who.textContent = CONFIG.from;
  const when = document.createElement('span'); when.className = 'when'; when.textContent = CONFIG.date;
  signEl.append(who, when);
  requestAnimationFrame(() => signEl.classList.add('show'));

  await wait(1100);
  if (my !== runId) return;
  choose.hidden = false;
  setTimeout(() => {
    const top = choose.getBoundingClientRect().top;
    if (top > window.innerHeight * .55) scroller.scrollBy({ top: top - window.innerHeight * .3 });
  }, 300);
}
letter.addEventListener('click', () => { fast = true; skipEl.hidden = true; });

/* ===== light the lantern ===== */
function light() {
  if (lit) return;
  lit = true;
  col.classList.add('lit');
  lantern.classList.add('on');
  lantern.setAttribute('aria-label', '南瓜灯已点亮');
  startMusic();
  sndBtn.hidden = false;
  if (!reduce) { spawnBurst(); emberOn = true; }
  setTimeout(() => {
    if (!lit) return;
    letter.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => letter.classList.add('show')));
    typeLetter();
  }, reduce ? 0 : 1000);
}
lantern.addEventListener('click', light);

/* ===== trick or treat ===== */
function showPrize(kind, srcBtn) {
  const p = CONFIG[kind];
  ticket.dataset.kind = kind;
  $('tKind').textContent = kind === 'treat' ? 'TREAT · 给糖' : 'TRICK · 捣蛋';
  $('tTitle').textContent = p.title;
  $('tNote').textContent = p.note;
  ticket.hidden = false;
  ticket.classList.remove('pop'); void ticket.offsetWidth; ticket.classList.add('pop');
  endEl.hidden = false; replayBtn.hidden = false;
  if (!reduce) { const r = srcBtn.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2); }
  setTimeout(() => {
    const r = replayBtn.getBoundingClientRect();
    if (r.bottom > window.innerHeight - 16) scroller.scrollBy({ top: r.bottom - window.innerHeight + 60 });
  }, 350);
}
$('btnTrick').addEventListener('click', e => showPrize('trick', e.currentTarget));
$('btnTreat').addEventListener('click', e => showPrize('treat', e.currentTarget));

/* ===== replay ===== */
replayBtn.addEventListener('click', () => {
  runId++; lit = false; fast = reduce; emberOn = false;
  bats.length = 0; embers.length = 0; bits.length = 0;
  stopMusic();
  caret.remove();
  col.classList.remove('lit'); lantern.classList.remove('on');
  lantern.setAttribute('aria-label', '点亮南瓜灯，打开一封信');
  letter.classList.remove('show'); letter.hidden = true;
  choose.hidden = true; ticket.hidden = true; endEl.hidden = true; replayBtn.hidden = true;
  sndBtn.hidden = true;
  scroller.scrollTo({ top: 0 });
});
})();
</script>
